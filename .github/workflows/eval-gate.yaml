name: Eval gate

# The A4 / P-08 self-eval gate. Runs eval/run_eval.py over the gate-logic golden set and
# fails (non-zero exit) if any metric : gate_accuracy, threshold_correctness,
# redteam_detection, safety : is below threshold. A4 is the promotion gate for the whole
# catalog (rule R5), so its own gate logic must itself be green before release.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # The eval gate runs deterministically on the onprem profile by default (fakes),
  # so the gate itself needs no cloud credentials.
  AI_QUALITY_PROFILE: onprem

jobs:
  eval:
    name: A4 self-eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev only, locked)
        # Deps come from the committed lockfile so the gate build is reproducible.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Run eval gate
        # Non-zero exit fails the gate and blocks promotion.
        run: python eval/run_eval.py
