name: CI

# Lint + type-check + tests on the LOCAL profile, so CI needs NO Google Cloud
# credentials and NO google-cloud-* packages, yet drives the real offline adapters.
# Integration tests are deselected.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_QUALITY_PROFILE: local

jobs:
  lint-type-test:
    name: ruff + mypy + pytest (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev only, no GCP SDK, locked)
        # Proves the domain + local profile install and run with no google-cloud-* deps.
        # Deps come from the committed lockfile so CI builds are reproducible.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Ruff (lint)
        # Whole tree, so CI scope equals the local gate. The only exclusion is the vendored
        # .agents/skills copies, declared in pyproject.toml and enforced by test_gate_scope.py.
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy (type-check)
        run: mypy src

      - name: Pytest (unit + contract, integration deselected)
        run: pytest -m 'not integration' -q

      - name: Self-eval gate (offline, no GCP creds)
        run: python eval/run_eval.py

      - name: End-to-end gate (local profile, real artifact offline)
        # Proves the whole promotion gate runs end to end with no Google Cloud SDK, and that
        # it still refuses to promote. PromotionGateService requires managed attestation
        # (passed = eval.passed AND eval.attested AND redteam.passed), so offline the correct
        # outcome is a FAIL whose only caveat is the missing attestation. Asserting that,
        # rather than a zero exit, is what keeps the offline evaluator from looking like
        # release authority. Checking the eval and red-team lines too means a real quality or
        # safety regression still fails this step instead of hiding behind the same FAIL.
        run: |
          set +e
          out=$(AI_QUALITY_PROFILE=local ai-quality gate gemini-3.5-flash v3 compliance-qa-golden 2>&1)
          status=$?
          set -e
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo "::error::the local profile must never be able to promote" >&2
            exit 1
          fi
          printf '%s\n' "$out" | grep -q 'not attested promotion evidence' || {
            echo "::error::gate failed for a reason other than missing attestation" >&2
            exit 1
          }
          printf '%s\n' "$out" | grep -qE '^Eval report .*\[PASS\]' || {
            echo "::error::the offline evaluation itself regressed" >&2
            exit 1
          }
          printf '%s\n' "$out" | grep -qE '^Red-team report .*\[PASS\]' || {
            echo "::error::the offline red-team harness regressed" >&2
            exit 1
          }
          echo "gate correctly withheld promotion offline; eval and red-team both passed"

      - name: Presenter demo self-test (live loopback server)
        run: PYTHONPATH=src:scripts python scripts/demo_selftest.py

      - name: Bounded portability proof
        run: PYTHONPATH=src python scripts/portability_demo.py

      - name: Institutional rename regression (fresh locked install)
        run: python scripts/rename_fork_selftest.py

  supply-chain:
    name: dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    # Fails on known-vulnerable dependencies. Locked requirements files are audited so
    # the result matches exactly what CI and the container image install.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: pip-audit (dev + gcp lockfiles)
        run: |
          python -m pip install --upgrade pip pip-audit
          # --no-deps: the lockfiles are fully compiled (every transitive dep pinned), so
          # audit exactly those versions without re-resolving. Newer pip-audit requires it
          # (or a hashed file) alongside --disable-pip.
          pip-audit -r requirements-dev.lock --disable-pip --no-deps
          pip-audit -r requirements-gcp.lock --disable-pip --no-deps

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: npm audit (high severity fails the build)
        # A hard gate, matching pip-audit on the Python side. Advisories are fixed by moving
        # the dependency, never by an allowlist that expires unattended.
        working-directory: ui
        run: npm audit --audit-level=high

  terraform:
    name: terraform fmt + validate (no cloud credentials)
    runs-on: ubuntu-latest
    # Offline posture check (practice D5): fmt and validate need providers, never
    # credentials, so residency/CMEK/perimeter drift is caught on every PR with no GCP
    # project in the loop. `-backend=false` keeps init from touching remote state.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt (check)
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend, no credentials)
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  ui-build:
    name: Next.js console builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install + build the thin console
        # npm audit alone cannot catch a UI-breaking dependency bump; only a real build can.
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm test
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npm run assert-hydratable
